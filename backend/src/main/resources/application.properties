# ====================================================================
# Faculty Achievement Portal - Backend Configuration (NIET)
# ====================================================================

# Optional local overrides for developer environment (Ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Application Info & Server Port
spring.application.name=faculty-achievement-portal
server.port=8080

# Database Configuration (MySQL 8.0+)
# Environment variable substitution with safe local fallback
spring.datasource.url=jdbc:mysql://localhost:3306/faculty_achievement_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# Using 'validate' to verify entity mappings against pre-created schema without modifying tables
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
