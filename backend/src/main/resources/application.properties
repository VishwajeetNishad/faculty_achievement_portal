# ====================================================================
# Faculty Achievement Portal - Production & Environment Configuration (NIET)
# ====================================================================

# Optional local developer environment overrides (Ignored by Git)
spring.config.import=optional:classpath:application-local.properties

# Application Info & Server Port
spring.application.name=faculty-achievement-portal
server.port=${PORT:8080}

# Behind a reverse proxy (Caddy/Nginx) that terminates HTTPS: honor X-Forwarded-*
# headers so the app sees the real scheme (https) and client IP.
server.forward-headers-strategy=framework

# Production Database Configuration (MySQL 8.0+)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:faculty_achievement_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Production Connection Pool (HikariCP) Settings
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate Production Schema Validation (NEVER create or alter production schema automatically)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Keep the JPA session open for the whole HTTP request (Spring Boot's default).
# Controllers here read lazy associations (e.g. user.getRole().getName()) while
# building responses OUTSIDE a @Transactional service method; disabling this
# closes the session too early and causes LazyInitializationException on login
# and most read endpoints. At this app's scale the extra connection-hold is a
# non-issue. (Future: map entities to DTOs inside a @Transactional boundary,
# then this can safely be set to false.)
spring.jpa.open-in-view=true

# Flyway Database Migrations: versioned SQL in classpath:db/migration runs at startup.
# baseline-on-migrate lets Flyway adopt an existing (pre-Flyway) database: it marks
# migrations up to baseline-version as already applied (so V1's CREATE TABLEs are skipped
# on a DB that already has the tables) and runs later ones (the idempotent V2 seed).
# A brand-new empty database ignores baselining and runs V1 then V2 from scratch.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# File Upload & Physical Storage Configuration (PDF Proof Documents)
app.file-storage.upload-dir=${APP_FILE_STORAGE_UPLOAD_DIR:uploads/achievements}
app.file-storage.max-file-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Production Authentication Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Production CORS Whitelisted Allowed Origins
app.cors.allowed-origins=${FRONTEND_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000}

# CORS dev toggle: when true the backend ALSO accepts any localhost origin/port (for
# a Live Server / IDE preview). Keep false in production — same-origin serving (Caddy
# hosts the frontend and /api under one domain) needs no cross-origin exceptions.
app.cors.allow-localhost=${CORS_ALLOW_LOCALHOST:false}

# ====================================================================
# Initial Admin Bootstrap (created once on first startup by AdminBootstrap)
# Set ADMIN_EMAIL and ADMIN_PASSWORD at deploy time (see .env.example). If either is
# blank, no admin is created. The password is BCrypt-hashed in code and never stored
# or logged in plaintext; nothing here is committed with real values.
# ====================================================================
app.bootstrap.admin.email=${ADMIN_EMAIL:}
app.bootstrap.admin.password=${ADMIN_PASSWORD:}
app.bootstrap.admin.employee-id=${ADMIN_EMPLOYEE_ID:EMP001}
app.bootstrap.admin.full-name=${ADMIN_FULL_NAME:System Administrator}
app.bootstrap.admin.designation=${ADMIN_DESIGNATION:Administrator}
app.bootstrap.admin.department-code=${ADMIN_DEPARTMENT_CODE:CSE}
app.bootstrap.admin.phone=${ADMIN_PHONE:}

# ====================================================================
# Public Share Links (Track B)
# The base address the "Copy Link" button hands out. The server builds the whole
# URL from this, so the link is correct in local development AND in production
# without a code change — and so an owner is never shown a link assembled from
# whatever host happened to be in their address bar.
# Local default matches the frontend dev server; in production set
# SHARE_BASE_URL=https://portal.niet.ac.in (see .env.example).
# ====================================================================
app.share.base-url=${SHARE_BASE_URL:http://localhost:5500}

# Spring Boot Actuator & Endpoint Protection (Minimal Health Check Only)
# enabled-by-default=false disables ALL actuator endpoints; we then re-enable only
# health. exposure.include=health ensures ONLY /actuator/health is reachable over
# HTTP (never env/beans/mappings, which could leak configuration). show-details=never
# hides the per-component breakdown so an anonymous caller only sees UP/DOWN.
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
