# Maven Wrapper configuration.
#   distributionUrl = the Apache Maven build tool the wrapper downloads and runs.
#   wrapperUrl      = the small wrapper JAR itself (only fetched if it is missing).
# The previous file put the distribution URL under the wrong key (wrapperUrl) and
# omitted distributionUrl, so the wrapper could not start.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
wrapperUrl=https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
