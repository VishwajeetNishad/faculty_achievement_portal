<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIET Faculty Achievement Portal | Noida Institute of Engineering and Technology</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background-color: var(--primary-color); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <div style="background-color: var(--surface-card); width: 100%; max-width: 480px; padding: 2.5rem; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); text-align: center;">
    
    <div style="margin-bottom: 1.5rem; display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; background-color: var(--primary-light); color: var(--primary-color); border-radius: var(--radius-lg); font-weight: bold; font-size: 1.25rem;">
      NIET
    </div>

    <h1 style="font-size: 1.5rem; font-weight: 700; color: var(--text-primary); margin-bottom: 0.5rem;">
      Faculty Achievement Portal
    </h1>
    <p style="font-size: 0.875rem; color: var(--text-secondary); margin-bottom: 2rem;">
      Noida Institute of Engineering and Technology (NIET)
    </p>

    <div style="display: flex; flex-direction: column; gap: 1rem;">
      <a href="pages/login.html" class="btn btn-primary btn-lg" style="width: 100%;">
        Faculty & Admin Portal Login
      </a>
      <a href="pages/dashboard.html" class="btn btn-outline" style="width: 100%;">
        Preview Faculty Dashboard
      </a>
      <a href="pages/admin/dashboard.html" class="btn btn-secondary" style="width: 100%;">
        Preview Admin Dashboard
      </a>
    </div>

    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.75rem; color: var(--text-tertiary);">
      &copy; 2026 NIET.
    </div>
  </div>

</body>
</html>
