<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Profile | NIET Faculty Achievement Portal</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">

    <!-- App Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span class="niet-brand-badge">NIET</span>
        <div class="sidebar-brand-title">
          Faculty Portal
          <span>NIET Noida</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Navigation</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="achievements.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              My Achievements
            </a>
          </li>
          <li class="nav-item">
            <a href="add-achievement.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Add Achievement
            </a>
          </li>
          <li class="nav-item">
            <a href="profile.html" class="nav-link active">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              My Profile
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="login.html" class="nav-link" style="color: #FCA5A5;">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- App Main Content Area -->
    <main class="app-main">
      
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title">Faculty Profile</h1>
        </div>
      </header>

      <div class="page-content">
        <div class="content-container">

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Personal & Academic Details</h2>
              <button type="button" id="editProfileBtn" class="btn btn-outline btn-sm">Edit Profile</button>
            </div>
            <div class="card-body">
              <form id="profileForm">
                <div class="form-grid">
                  <div class="form-group">
                    <label class="form-label" for="profileName">Full Name</label>
                    <input type="text" id="profileName" class="form-control profile-editable" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileEmpId">Employee ID</label>
                    <input type="text" id="profileEmpId" class="form-control" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileEmail">Email Address</label>
                    <input type="email" id="profileEmail" class="form-control" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileDepartment">Department</label>
                    <input type="text" id="profileDepartment" class="form-control" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileDesignation">Designation</label>
                    <input type="text" id="profileDesignation" class="form-control profile-editable" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profilePhone">Phone</label>
                    <input type="tel" id="profilePhone" class="form-control profile-editable" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileRole">Institutional Role</label>
                    <input type="text" id="profileRole" class="form-control" readonly>
                  </div>
                  <div class="form-group">
                    <label class="form-label" for="profileStatus">Account Status</label>
                    <input type="text" id="profileStatus" class="form-control" readonly>
                  </div>
                </div>

                <div id="profileActionGroup" style="display: none; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                  <button type="button" id="cancelProfileBtn" class="btn btn-outline">Cancel</button>
                  <button type="submit" id="saveProfileBtn" class="btn btn-primary">Save Profile Changes</button>
                </div>
              </form>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/profile.js"></script>
</body>
</html>
