<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Achievement | NIET Faculty Achievement Portal</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">

    <!-- App Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <span class="niet-brand-badge">NIET</span>
        <div class="sidebar-brand-title">
          Faculty Portal
          <span>NIET Noida</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Main Navigation</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="achievements.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              My Achievements
            </a>
          </li>
          <li class="nav-item">
            <a href="add-achievement.html" class="nav-link active">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
              Add Achievement
            </a>
          </li>
          <li class="nav-item">
            <a href="profile.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              My Profile
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="login.html" class="nav-link" style="color: #FCA5A5;">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- App Main Content Area -->
    <main class="app-main">
      
      <!-- Topbar Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title">Submit Achievement Record</h1>
        </div>
      </header>

      <!-- Page Body Content -->
      <div class="page-content">
        <div class="content-container">

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Achievement Information Form</h2>
            </div>

            <div class="card-body">
              <form onsubmit="event.preventDefault(); alert('Achievement submission UI preview recorded!'); window.location.href='achievements.html';">
                
                <div class="form-grid">
                  
                  <div class="form-group">
                    <label class="form-label" for="categorySelect">
                      Achievement Category <span class="required-star">*</span>
                    </label>
                    <select id="categorySelect" class="form-control" required>
                      <option value="">-- Select Category --</option>
                      <option value="publication">Research Publication</option>
                      <option value="patent">Patent / Intellectual Property</option>
                      <option value="research_grant">Research Grant</option>
                      <option value="workshop_fdp">Workshop / FDP</option>
                      <option value="award">Award / Recognition</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="achievementTitle">
                      Title of Achievement <span class="required-star">*</span>
                    </label>
                    <input type="text" id="achievementTitle" class="form-control" placeholder="e.g. Deep Learning in Healthcare Systems" required>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="achievementDate">
                      Date of Achievement / Event <span class="required-star">*</span>
                    </label>
                    <input type="date" id="achievementDate" class="form-control" required>
                  </div>

                  <div class="form-group">
                    <label class="form-label" for="academicYear">
                      Academic Year <span class="required-star">*</span>
                    </label>
                    <select id="academicYear" class="form-control" required>
                      <option value="2025-2026">2025-2026</option>
                      <option value="2024-2025">2024-2025</option>
                      <option value="2023-2024">2023-2024</option>
                    </select>
                  </div>

                  <div class="form-group full-width">
                    <label class="form-label" for="description">
                      Description & Details
                    </label>
                    <textarea id="description" class="form-control" placeholder="Provide a summary of the achievement, contributors, or institutional impact..."></textarea>
                  </div>

                  <div class="form-group full-width">
                    <label class="form-label" for="proofUrl">
                      Proof Document URL (Certificate / Paper Link)
                    </label>
                    <input type="url" id="proofUrl" class="form-control" placeholder="https://example.com/certificates/proof.pdf">
                  </div>

                </div>

                <!-- Dynamic Fieldsets for Category Details -->
                
                <!-- Publication Fieldset -->
                <div class="fieldset-section" id="section-publication" style="display: none;">
                  <h3 class="fieldset-title">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    Publication Specific Details
                  </h3>
                  <div class="form-grid">
                    <div class="form-group">
                      <label class="form-label">Journal / Conference Name</label>
                      <input type="text" class="form-control" placeholder="e.g. IEEE Transactions on Medical Imaging">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Indexing</label>
                      <select class="form-control">
                        <option value="SCI">SCI / SCIE</option>
                        <option value="SCOPUS">Scopus</option>
                        <option value="UGC_CARE">UGC CARE</option>
                        <option value="OTHER">Other Peer Reviewed</option>
                      </select>
                    </div>
                    <div class="form-group">
                      <label class="form-label">Impact Factor</label>
                      <input type="number" step="0.01" class="form-control" placeholder="e.g. 4.85">
                    </div>
                    <div class="form-group">
                      <label class="form-label">DOI / URL</label>
                      <input type="text" class="form-control" placeholder="10.1109/TMI.2025.12345">
                    </div>
                  </div>
                </div>

                <!-- Patent Fieldset -->
                <div class="fieldset-section" id="section-patent" style="display: none;">
                  <h3 class="fieldset-title">
                    <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                    Patent Specific Details
                  </h3>
                  <div class="form-grid">
                    <div class="form-group">
                      <label class="form-label">Patent Number</label>
                      <input type="text" class="form-control" placeholder="e.g. 202511012345">
                    </div>
                    <div class="form-group">
                      <label class="form-label">Patent Status</label>
                      <select class="form-control">
                        <option value="FILED">Filed</option>
                        <option value="PUBLISHED">Published</option>
                        <option value="GRANTED">Granted</option>
                      </select>
                    </div>
                  </div>
                </div>

                <!-- Form Action Buttons -->
                <div style="display: flex; gap: 1rem; justify-content: flex-end; margin-top: 2rem;">
                  <a href="achievements.html" class="btn btn-outline">Cancel</a>
                  <button type="submit" class="btn btn-primary btn-lg">Submit Achievement</button>
                </div>

              </form>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/achievements.js"></script>
</body>
</html>
