<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achievement Search &amp; Verification | NIET Admin Portal</title>
  <meta name="description" content="Search, filter and verify faculty achievements institution-wide at NIET Noida.">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <style>
    .search-toolbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(155px, 1fr)); gap: 0.75rem; align-items: flex-end; }
    .btn-row { display: flex; gap: 0.5rem; align-items: center; }
    .pagination-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.75rem; padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); }
    .pagination-controls { display: flex; gap: 0.4rem; align-items: center; }
    .pagination-controls button { min-width: 34px; padding: 0.3rem 0.6rem; border: 1px solid var(--border-color); background: var(--surface-color); border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .pagination-controls button:hover { background: #DC2626; color: #fff; }
    .pagination-controls button.active { background: #DC2626; color: #fff; border-color: #DC2626; }
    .pagination-controls button:disabled { opacity: 0.45; cursor: not-allowed; }
    .pagination-info { font-size: 0.82rem; color: var(--text-muted); }
    .admin-accent { color: #DC2626; }
  </style>
</head>
<body>

  <div class="app-wrapper">

    <!-- Admin Sidebar -->
    <aside class="app-sidebar" id="appSidebar" style="background-color: #0F172A;">
      <div class="sidebar-header">
        <span class="niet-brand-badge" style="background-color: #DC2626; color: #FFF;">ADMIN</span>
        <div class="sidebar-brand-title">
          NIET Portal
          <span>Control Center</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Administration</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Admin Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="achievements.html" class="nav-link active">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              Achievement Search
            </a>
          </li>
          <li class="nav-item">
            <a href="faculty.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Faculty Roster
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="nav-link" style="color: #FCA5A5;">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">

      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title">Institution-Wide Achievement Search</h1>
        </div>
      </header>

      <div class="page-content">
        <div class="content-container">

          <!-- Search & Filter Toolbar -->
          <div class="card" style="margin-bottom: 1.25rem;">
            <div class="card-body" style="padding: 1.25rem 1.5rem;">
              <div class="search-toolbar">
                <!-- Keyword -->
                <div>
                  <label class="form-label" for="adminSearchKeyword">Keyword</label>
                  <input type="text" id="adminSearchKeyword" class="form-control" placeholder="Title or description..." autocomplete="off">
                </div>

                <!-- Status -->
                <div>
                  <label class="form-label" for="adminFilterStatus">Status</label>
                  <select id="adminFilterStatus" class="form-control">
                    <option value="">All Statuses</option>
                    <option value="PENDING">Pending</option>
                    <option value="APPROVED">Approved</option>
                    <option value="REJECTED">Rejected</option>
                  </select>
                </div>

                <!-- Category -->
                <div>
                  <label class="form-label" for="adminFilterCategory">Category</label>
                  <select id="adminFilterCategory" class="form-control">
                    <option value="">All Categories</option>
                  </select>
                </div>

                <!-- Department (ADMIN only — full institutional scope) -->
                <div>
                  <label class="form-label" for="adminFilterDept">Department</label>
                  <select id="adminFilterDept" class="form-control">
                    <option value="">All Departments</option>
                  </select>
                </div>

                <!-- Academic Year -->
                <div>
                  <label class="form-label" for="adminFilterYear">Academic Year</label>
                  <select id="adminFilterYear" class="form-control">
                    <option value="">All Years</option>
                  </select>
                </div>

                <!-- Date From -->
                <div>
                  <label class="form-label" for="adminFilterFromDate">From Date</label>
                  <input type="date" id="adminFilterFromDate" class="form-control">
                </div>

                <!-- Date To -->
                <div>
                  <label class="form-label" for="adminFilterToDate">To Date</label>
                  <input type="date" id="adminFilterToDate" class="form-control">
                </div>

                <!-- Sort -->
                <div>
                  <label class="form-label" for="adminFilterSort">Sort By</label>
                  <select id="adminFilterSort" class="form-control">
                    <option value="createdAt_desc">Newest First</option>
                    <option value="createdAt_asc">Oldest First</option>
                    <option value="achievementDate_desc">Achievement Date ↓</option>
                    <option value="achievementDate_asc">Achievement Date ↑</option>
                    <option value="title_asc">Title A–Z</option>
                    <option value="status_asc">Status A–Z</option>
                  </select>
                </div>

                <!-- Buttons -->
                <div>
                  <label class="form-label">&nbsp;</label>
                  <div class="btn-row">
                    <button type="button" id="adminApplyFiltersBtn" class="btn btn-primary" style="flex:1;">Search</button>
                    <button type="button" id="adminClearFiltersBtn" class="btn btn-outline" style="flex:1;">Clear</button>
                  </div>
                </div>
              </div>

              <!-- Export Row -->
              <div style="display: flex; justify-content: flex-end; margin-top: 0.75rem;">
                <button type="button" id="adminExportCsvBtn" class="btn btn-outline">⬇ Export CSV</button>
              </div>
            </div>
          </div>

          <!-- Achievement Table -->
          <div class="card">
            <div class="card-body" style="padding: 0;">
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Faculty &amp; Dept</th>
                      <th>Title &amp; Category</th>
                      <th>Academic Year</th>
                      <th>Submitted</th>
                      <th>Status</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody id="adminQueueTableBody">
                    <!-- Dynamic rendering by admin.js -->
                  </tbody>
                </table>
              </div>

              <!-- Pagination Bar -->
              <div class="pagination-bar" id="adminPaginationBar" style="display:none;">
                <div class="pagination-info" id="adminPaginationInfo"></div>
                <div class="pagination-controls" id="adminPaginationControls"></div>
              </div>
            </div>
          </div>

        </div>
      </div>

    </main>
  </div>

  <!-- Review Modal Dialog -->
  <div class="modal-backdrop" id="reviewModal" aria-hidden="true" role="dialog" aria-labelledby="reviewModalTitle">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="reviewModalTitle">Review Faculty Achievement Record</h3>
        <button class="modal-close-btn" onclick="closeModal('reviewModal')" aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <div id="reviewModalContent" style="margin-bottom: 1.25rem;">
          <!-- Populated dynamically -->
        </div>

        <div class="form-group">
          <label class="form-label" for="verifyComment">Verification Feedback / Rejection Reason</label>
          <textarea id="verifyComment" class="form-control" placeholder="Provide feedback or justification for rejection..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="btnRejectRecord">Reject Achievement</button>
        <button class="btn btn-primary" id="btnApproveRecord">Approve Achievement</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/admin.js"></script>
</body>
</html>
