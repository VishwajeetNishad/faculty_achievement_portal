<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../../assets/niet-logo.png">
  <title>Faculty Roster | NIET Admin Portal</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/forms.css">
  <link rel="stylesheet" href="../../css/tables.css">
  <link rel="stylesheet" href="../../css/responsive.css">
</head>
<body>

  <div class="app-wrapper">

    <!-- Admin Sidebar -->
    <aside class="app-sidebar" id="appSidebar" style="background-color: #0F172A;">
      <div class="sidebar-header">
        <span class="niet-logo-badge">
          <img src="../../assets/niet-logo.png" alt="NIET — Noida Institute of Engineering and Technology">
        </span>
        <div class="sidebar-brand-title">
          Admin Console
          <span>Control Center</span>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">Administration</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="dashboard.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
              Admin Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a href="achievements.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
              Verification Queue
            </a>
          </li>
          <li class="nav-item">
            <a href="faculty.html" class="nav-link active">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
              Faculty Roster
            </a>
          </li>
          <li class="nav-item">
            <a href="user-permissions.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
              User Permissions
            </a>
          </li>
          <li class="nav-item">
            <a href="audit-logs.html" class="nav-link">
              <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
              Audit Trail
            </a>
          </li>
        </ul>
      </nav>

      <div class="sidebar-footer">
        <a href="../login.html" class="nav-link" style="color: #FCA5A5;">
          <svg class="nav-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Sign Out
        </a>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="app-main">
      
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-toggle-btn" id="mobileToggleBtn" aria-label="Toggle Navigation">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <h1 class="page-title">NIET Faculty Roster</h1>
        </div>
      </header>

      <div class="page-content">
        <div class="content-container">

          <div class="card" style="margin-bottom: 1.25rem;">
            <div class="card-body" style="padding: 1rem 1.5rem;">
              <div style="display: flex; flex-wrap: wrap; gap: 1rem; align-items: flex-end;">
                <div style="flex: 1; min-width: 200px;">
                  <label class="form-label" for="searchFaculty">Search Faculty</label>
                  <input type="text" id="searchFaculty" class="form-control" placeholder="Search by name, EMP ID or email...">
                </div>
                <div style="min-width: 160px;">
                  <label class="form-label" for="departmentFilter">Department</label>
                  <select id="departmentFilter" class="form-control">
                    <option value="">All Departments</option>
                  </select>
                </div>
                <div style="min-width: 130px;">
                  <label class="form-label" for="statusFilter">Status</label>
                  <select id="statusFilter" class="form-control">
                    <option value="">All Status</option>
                    <option value="ACTIVE">Active</option>
                    <option value="INACTIVE">Inactive</option>
                    <option value="SUSPENDED">Suspended</option>
                  </select>
                </div>
              </div>
              <div style="display: flex; gap: 1.5rem; margin-top: 1rem; font-size: 0.875rem; color: #94A3B8;">
                <span>Total: <strong id="totalFacultyCount" style="color: #E2E8F0;">0</strong></span>
                <span>Active: <strong id="activeFacultyCount" style="color: #4ADE80;">0</strong></span>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2 class="card-title">Registered Faculty Members</h2>
            </div>
            <div class="card-body" style="padding: 0;">
              <div class="table-responsive">
                <table class="data-table">
                  <thead>
                    <tr>
                      <th>Employee ID & Name</th>
                      <th>Email</th>
                      <th>Department</th>
                      <th>Designation</th>
                      <th>Status</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="facultyRosterTableBody">
                    <!-- Dynamic rendering by admin.js -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

        </div>
      </div>

    </main>

  </div>

  <script src="../../js/config.js"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/common.js"></script>
  <script src="../../js/admin.js"></script>
</body>
</html>
