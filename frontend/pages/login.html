<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faculty Login | NIET Faculty Achievement Portal</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/forms.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="background-color: var(--bg-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem;">

  <main class="card" style="width: 100%; max-width: 440px; box-shadow: var(--shadow-lg);">
    <div class="card-header" style="flex-direction: column; text-align: center; gap: 0.5rem; padding: 2.25rem 1.5rem 1rem;">
      <span class="niet-brand-badge" style="font-size: 1rem; padding: 0.35rem 0.75rem;">NIET NOIDA</span>
      <h1 class="card-title" style="font-size: 1.35rem; margin-top: 0.25rem;">Institutional Login</h1>
      <p style="font-size: 0.875rem; color: var(--text-secondary);">Faculty Achievement Portal</p>
    </div>

    <div class="card-body">
      
      <!-- Alert Message Placeholder -->
      <div id="loginAlert" class="alert alert-info" style="display: none;">
        <span>Please enter your faculty or admin credentials to sign in.</span>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
        
        <div class="form-group">
          <label class="form-label" for="loginEmail">
            Employee ID / Email Address <span class="required-star">*</span>
          </label>
          <input type="text" id="loginEmail" class="form-control" placeholder="e.g. EMP001 or faculty@niet.co.in" required aria-required="true">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">
            Password <span class="required-star">*</span>
          </label>
          <div class="form-control-wrapper">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required aria-required="true">
            <button type="button" class="password-toggle-btn" data-target="loginPassword" aria-label="Toggle password visibility">
              <svg style="width: 20px; height: 20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
            </button>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.875rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-secondary);">
            <input type="checkbox" checked> Remember me
          </label>
          <a href="#" style="font-size: 0.875rem; color: var(--primary-color);">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">
          Sign In to Portal
        </button>

      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.75rem; color: var(--text-tertiary); border-top: 1px solid var(--border-color); padding-top: 1rem;">
        NIET Noida Internal Application &bull; Authorised Personnel Only
      </div>
    </div>
  </main>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/common.js"></script>
</body>
</html>
